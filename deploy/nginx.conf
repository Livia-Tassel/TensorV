# Install this file inside Nginx's http context (for example sites-enabled).
# Replace tensorv.example.com and issue its certificate before enabling HTTPS.
limit_req_zone $binary_remote_addr zone=tensorv_api:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=tensorv_execute:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=tensorv_connections:1m;

server {
    listen 80;
    server_name tensorv.example.com;
    location /.well-known/acme-challenge/ {
        root /var/lib/tensorv-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tensorv.example.com;
    ssl_certificate /etc/letsencrypt/live/tensorv-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tensorv-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tensorv_tls:1m;
    server_tokens off;

    client_max_body_size 100k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_conn tensorv_connections 10;
    limit_conn_status 429;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log /var/log/nginx/tensorv-access.log;
    error_log /var/log/nginx/tensorv-error.log warn;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 10s;
    proxy_request_buffering on;

    location = /api/execute {
        limit_req zone=tensorv_execute burst=3 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
    location /api/ {
        limit_req zone=tensorv_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
    }
}
